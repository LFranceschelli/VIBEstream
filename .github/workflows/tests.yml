name: tests
# Software tests only: the camera (Metavision) and the Analog Discovery are
# replaced by fakes/mocks inside the tests.  Nothing here touches hardware.
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: sudo apt-get update && sudo apt-get install -y xvfb
      - run: python -m pip install -e ".[fast]"
      - run: python tools/test_vibe.py
      - run: python tools/test_hr.py
      - run: python tools/test_hr_import.py
      - run: xvfb-run -a python tools/test_gui.py
